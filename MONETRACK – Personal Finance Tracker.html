const TX=()=>S.tx.filter(x=>(x.cur||S.cur)===S.cur),N=()=>S.name?', '+S.name:'',nm2=s=>S.name?S.name+', '+s:s[0].toUpperCase()+s.slice(1),hs=s=>{let h=5381;for(let i=0;i<s.length;i++)h=(h*33^s.charCodeAt(i))>>>0;return s.length+'-'+h};

f(1,'expense','Rent',12000,'Apartment rent','Bank Transfer');f(15,'income','Salary',52000,'Monthly salary','Bank Transfer');f(10,'income','Freelance',3000+(i*1700)%6000,'Design project','E-Wallet');f(3,'expense','Groceries',2200+(i*370)%1500,'Supermarket');f(7,'expense','Food',1500+(i*430)%1800,'Dining out','Card');f(9,'expense','Transportation',1200+(i*260)%900,'Commute');f(12,'expense','Shopping',1800+(i*910)%3800,'Clothes','Card');f(5,'expense','Bills',2900,'Electricity and water','Bank Transfer');f(8,'expense','Subscriptions',698,'Netflix and Spotify','Card');f(18,'expense','Entertainment',900+(i*350)%1500,'Movies and games')}return tx}

const TOP=['PHP','USD','EUR','GBP','JPY','AUD','CAD','SGD','INR','AED','CHF','NZD'],BADC=['XAU','XAG','XPT','XPD','XDR','XTS','XXX','XBA','XBB','XBC','XBD','XSU','XUA'];let CURS=null,CP='set';
function curs(){if(CURS)return CURS;let cd=[];try{cd=Intl.supportedValuesOf('currency')}catch(e){}cd=[...new Set([...cd,...TOP,'CNY','KRW','MXN','BRL','ZAR','SEK','NOK','DKK','HKD','THB','IDR','MYR','VND','SAR','TRY','PLN','CZK','HUF','ILS','NGN','KES','EGP','PKR','BDT'])].filter(c=>!BADC.includes(c));let cn=null,rn=null;try{cn=new Intl.DisplayNames(['en'],{type:'currency'});rn=new Intl.DisplayNames(['en'],{type:'region'})}catch(e){}
CURS=cd.map(c=>{let name=c,sym=c,f='';try{name=cn.of(c)||c}catch(e){}try{sym=new Intl.NumberFormat('en',{style:'currency',currency:c,currencyDisplay:'symbol'}).formatToParts(0).find(p=>p.type==='currency').value}catch(e){}if(c[0]!=='X'){const cc=c==='EUR'?'EU':c.slice(0,2);try{if(rn.of(cc)!==cc)f=String.fromCodePoint(...[...cc].map(ch=>127397+ch.charCodeAt(0)))}catch(e){}}sym=({AED:'د.إ',CAD:'C$',SGD:'S$',NZD:'NZ$',AUD:'A$'})[c]||sym;return{c,name,sym,f}}).sort((x,y)=>{const i=TOP.indexOf(x.c),j=TOP.indexOf(y.c);return i>=0||j>=0?(i<0?99:i)-(j<0?99:j):x.name.localeCompare(y.name)});return CURS}
const curLbl=id=>{const x=curs().find(y=>y.c===id);return x?`${x.f} ${esc(x.name)} (${x.c}) ${esc(x.sym)}`:esc(id)};
function curItems(q,sel){q=q.toLowerCase().trim();const l=curs().filter(x=>!q||(x.name+' '+x.c+' '+x.sym).toLowerCase().includes(q));return l.length?l.map(x=>`<button class="ci ${x.c===sel?'on':''}" role="option" aria-selected="${x.c===sel}" data-a="pickc" data-id="${x.c}"><span class="fg" aria-hidden="true">${x.f||'🌐'}</span><span><b>${esc(x.name)}</b><small>${x.c}</small></span><span class="sy">${esc(x.sym)}</span></button>`).join(''):empty('No currency found. Try another name or code.')}
